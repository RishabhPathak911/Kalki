name: Kalki privacy and delivery checks
on: [push, pull_request, workflow_dispatch]
jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: go run ./scripts/gen-certs
      - run: npm ci --prefix dashboard
      - run: npm test --prefix dashboard
      - run: npm run build --prefix dashboard
      - run: npm run check
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o collector ./tier1
      - run: go build -o tier2-server ./tier2
      # A closed loopback port exercises failed probes without internet.
      - run: go run ./tier1 --mode=live --probe-target=127.0.0.1:1 --duration=60s --print
      - run: go run ./tier1 --mode=live --probe-target=127.0.0.1:1 --duration=6s --print-egress
